name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Any job needing more asks for it explicitly.
permissions:
  contents: read

# A newer push to the same PR cancels the older run. Not on main, where we want
# every commit to have its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          shellcheck --severity=style --external-sources scripts/*.sh

      - name: actionlint
        run: |
          # Pin by version so a bad release cannot break every PR at once.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - name: editorconfig
        run: |
          # Unpacked into a scratch directory, not here. The release tarball carries its
          # own README.md, LICENSE and CHANGELOG.md at the root, so extracting in place
          # drops them on top of ours and the checker then lints the tool's files.
          mkdir -p "$RUNNER_TEMP/ec"
          curl -fsSL https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.3.0/ec-linux-amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/ec"
          "$RUNNER_TEMP/ec/bin/ec-linux-amd64" -exclude '^(LICENSE|overlay/.*)$'

  house-style:
    name: House style
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No private infrastructure anywhere in the tree
        env:
          # An extended regex of host names that must never appear here. Deliberately a
          # secret rather than a literal in this file, because a denylist of host names
          # committed to a public repository is itself the leak it is trying to prevent.
          # Unset on pull requests from forks, where the generic checks still apply.
          PRIVATE_HOST_PATTERN: ${{ secrets.PRIVATE_HOST_PATTERN }}
        run: |
          fail=0
          scan() { grep -rnE "$1" --exclude-dir=.git --exclude-dir=.upstream . && return 0 || return 1; }

          if scan '\b(10\.[0-9]{1,3}|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}\b'; then
            echo "::error::a private IP address is in the tree"; fail=1
          fi
          if scan 'BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|ssh-(rsa|ed25519) AAAA'; then
            echo "::error::key material is in the tree"; fail=1
          fi
          if [ -n "$PRIVATE_HOST_PATTERN" ] && grep -rniE "$PRIVATE_HOST_PATTERN" \
            --exclude-dir=.git --exclude-dir=.upstream . ; then
            echo "::error::private infrastructure is named in the tree"; fail=1
          fi
          exit $fail

      - name: Prose style
        run: |
          # We write plain English here. Em dashes and non breaking spaces creep in
          # from copy and paste and they are a reliable smell.
          bad=0
          while IFS= read -r f; do
            if grep -nP '\x{2014}|\x{00A0}|\x{2018}|\x{2019}|\x{201C}|\x{201D}' "$f"; then
              echo "::error file=$f::use plain ASCII punctuation, no em dashes or smart quotes"
              bad=1
            fi
          done < <(git ls-files '*.md' 'docs/*' '.github/**')
          exit $bad

  overlay:
    name: Overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the upstream checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .upstream
          key: upstream-${{ hashFiles('upstream.lock') }}
          restore-keys: upstream-

      - name: Check the overlay is well formed and still lines up with the pin
        run: ./scripts/check-overlay.sh
        env:
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost

  # Placeholder for the real thing. From M1 this builds the compiler for a Windows
  # target on a Linux host and stops being a no-op. Kept here from the start so the
  # job name is stable in branch protection.
  cross-build:
    name: Cross build (windows-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Not implemented yet
        run: |
          echo "Cross building for Windows lands in milestone M1."
          echo "See https://github.com/tamnd/mojo.windows/milestones"
