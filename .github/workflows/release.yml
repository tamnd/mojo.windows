name: Release

# What this workflow builds is the overlay plus the documents, with checksums and a
# provenance attestation. The Windows binaries are not built here and cannot be: they
# need a Windows sysroot and a Bazel build measured in hours, so scripts/package-windows.sh
# produces them on a machine that has both and they are uploaded to the draft by hand.
# docs/releasing.md is the procedure and says why the split is where it is.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The attestation needs to mint an OIDC token and write an attestation, so this job
    # cannot run on the read only default.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Work out the version
        id: meta
        env:
          # Through the environment rather than interpolated into the script, so a tag
          # name can never be read as shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            version="${INPUT_TAG#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A release must say which upstream commit it is against. Without that a bug
          # report against it is close to useless.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("upstream.lock"))
          print(f"Upstream pin: `{d['tag']}` (`{d['commit']}`)")
          PY

      - name: Build the archive
        run: |
          name="mojo-windows-overlay-${{ steps.meta.outputs.version }}"
          mkdir -p "dist/$name"
          cp -r overlay scripts docs upstream.lock README.md LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && zip -qr "$name.zip" "$name")
          rm -rf "dist/$name"
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # One pattern per line rather than a brace expansion. This action globs with
          # @actions/glob, which does not expand braces, so `dist/*.{tar.gz,zip}` is
          # matched literally and finds nothing. It fails with "Could not find subject
          # at path", which reads like the archive step is broken when it is not.
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          retention-days: 7

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          body: |
            Unofficial community build. Not affiliated with Modular or Qualcomm.

            Verify what you downloaded before using it:

            ```sh
            sha256sum -c SHA256SUMS
            sha256sum -c SHA256SUMS-windows
            gh attestation verify <file> --repo ${{ github.repository }}
            ```

            The overlay archives are built by CI and carry a provenance attestation. The
            Windows archives, if this release has any, do not. CI cannot build them: that
            needs a Windows sysroot and hours of Bazel, so they are cross compiled on a
            known machine and uploaded by hand, and the checksums are what there is to
            check them against. docs/releasing.md says how they were made.

            Releases are drafted rather than published automatically. Fill in what works
            and what does not before you publish, because that list is the most useful
            part of the notes.
