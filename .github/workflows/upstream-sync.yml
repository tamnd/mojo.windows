name: Upstream sync

# Keeps the pin moving. The whole point of pinning rather than forking is that drift
# becomes a scheduled, visible event instead of something you discover six months later.
#
# Clean bump  -> opens a pull request.
# Conflict    -> opens or updates one tracking issue, and changes nothing else.

on:
  schedule:
    # Mondays, 06:00 UTC. Early enough in the week that a broken bump gets looked at.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to pin to. Leave empty for the newest mojo/v* release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  bump:
    name: Replay the series onto newer upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the upstream checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .upstream
          key: upstream-sync-${{ github.run_id }}
          restore-keys: upstream-

      - name: Attempt the bump
        id: bump
        env:
          TARGET_TAG: ${{ inputs.tag }}
          GIT_AUTHOR_NAME: upstream-sync
          GIT_AUTHOR_EMAIL: upstream-sync@users.noreply.github.com
          GIT_COMMITTER_NAME: upstream-sync
          GIT_COMMITTER_EMAIL: upstream-sync@users.noreply.github.com
        run: |
          set -o pipefail
          before="$(python3 -c 'import json;print(json.load(open("upstream.lock"))["tag"])')"
          echo "before=$before" >> "$GITHUB_OUTPUT"

          if ./scripts/bump-upstream.sh ${TARGET_TAG:+"$TARGET_TAG"} 2>&1 | tee bump.log; then
            after="$(python3 -c 'import json;print(json.load(open("upstream.lock"))["tag"])')"
            echo "after=$after" >> "$GITHUB_OUTPUT"
            if [ "$before" = "$after" ]; then
              echo "result=nochange" >> "$GITHUB_OUTPUT"
            else
              echo "result=ok" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.bump.outputs.result == 'ok'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: upstream-sync/${{ steps.bump.outputs.after }}
          base: main
          commit-message: |
            build: bump upstream pin to ${{ steps.bump.outputs.after }}

            Merged the overlay onto ${{ steps.bump.outputs.after }}. Every file merged
            cleanly, so this touches upstream.lock and whichever overlay files upstream
            moved underneath us.
          title: 'build: bump upstream pin to ${{ steps.bump.outputs.after }}'
          labels: |
            area/upstream
            type/chore
          delete-branch: true
          add-paths: |
            upstream.lock
            overlay
          body: |
            Automated bump from `${{ steps.bump.outputs.before }}` to `${{ steps.bump.outputs.after }}`.

            Every overlay file merged cleanly, so the only changes here are the pin itself
            and whichever overlay files upstream edited underneath us.

            Read the diff to `overlay/` before merging. A clean three way merge means git
            found no overlapping lines, not that the result is right. If upstream reworked
            the code around one of our changes, the merge succeeds and the result is
            nonsense, and this is the only place anybody looks at it.

            Note that pull requests opened by the workflow token do not themselves start
            CI runs. Close and reopen this one, or push an empty commit, to get a result.

      - name: File or update the drift issue
        if: steps.bump.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.bump.outputs.before }}
          # Passed through the environment rather than interpolated straight into the
          # script, which is the standard way to keep workflow expressions out of shell.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream drift: the overlay no longer merges"
          python3 scripts/drift-body.py "$BEFORE" "$RUN_URL" bump.log > drift-body.md

          existing="$(gh issue list --label upstream-drift --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift-body.md
          else
            gh issue create --title "$title" --body-file drift-body.md \
              --label upstream-drift --label area/upstream --label priority/p1
          fi

      - name: Nothing to do
        if: steps.bump.outputs.result == 'nochange'
        run: echo "Already on the newest upstream release tag."
